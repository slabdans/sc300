<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SC-300 Practice Exam</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Header Bar -->
  <header>
    <div class="title">SC-300 Practice Exam</div>
    <div class="header-right">
      <div class="timer">
        <span class="timer-icon">⏱</span> <span id="timer-display">--:--</span>
      </div>
      <button type="button" id="pauseBtn" class="btn-secondary btn-sm" style="display: none;">Pause</button>
      <div class="question-count" id="question-count-text">Question 1</div>
    </div>
  </header>

 <!-- Setup Screen -->
  <main id="setup-screen">
    <h1>Exam Setup</h1>
    <p class="subtitle">Configure preferences below to start a practice assessment.</p>

    <!-- NEW: Participant Details Inputs -->
    <div class="form-group">
      <label for="participantName">Full Name:</label>
      <input type="text" id="participantName" placeholder="Enter your full name" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label for="participantEmail">Email Address:</label>
      <input type="email" id="participantEmail" placeholder="Enter your email" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
    </div>
    <!-- End of New Inputs -->

    <div class="form-group" style="margin-top: 15px;">
      <label for="timeLimit">Time Limit (Minutes):</label>
      <input type="number" id="timeLimit" value="60" min="0">
      <span class="hint">Set to 0 for untimed mode.</span>
    </div>

    <!-- Question Range Selection Inputs -->
    <div class="form-group" style="margin-top: 15px;">
      <label>Question Range:</label>
      <div style="display: flex; gap: 10px; align-items: center; justify-content: center;">
        <input type="number" id="startRange" value="1" min="1" style="width: 80px;" placeholder="From">
        <span>to</span>
        <input type="number" id="endRange" value="10" min="1" style="width: 80px;" placeholder="To">
      </div>
      <span class="hint">Specify start and end question numbers.</span>
    </div>

    <!-- Randomize Checkbox -->
    <div class="form-group" style="margin-top: 15px;">
      <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="shuffleToggle"> Randomize questions
      </label>
    </div>

    <button class="btn-primary" id="startBtn" style="margin-top: 15px;">Start Exam</button>
  </main>

  <!-- Exam Workspace Screen -->
  <main id="exam-screen" style="display: none;">
    <div class="exam-controls">
      <div class="nav-shortcut">
        <label for="question-select">Jump to Question:</label>
        <select id="question-select" class="dropdown-select"></select>
      </div>
      <button type="button" id="bookmarkBtn" class="btn-bookmark">🔖 Bookmark</button>
    </div>

    <hr class="divider">

    <!-- Dynamic Question Content -->
    <div id="question-text" class="question-body"></div>
    <div id="options-container" class="options-group"></div>

    <!-- Exam Navigation Actions -->
    <div class="quiz-actions">
      <button type="button" id="prevBtn" class="btn-secondary">Previous</button>
      <button type="button" id="submitBtn" class="btn-primary">Submit Answer</button>
      <button type="button" id="nextBtn" class="btn-secondary">Next</button>
      <button type="button" id="finishBtn" class="btn-primary" style="display: none; background-color: #28a745;">Finish Exam</button>
    </div>

    <!-- Feedback & Explanations -->
    <div id="explanation-box" class="explanation-box"></div>
  </main>

<!-- Results Screen -->
  <main id="results-screen" style="display: none; text-align: center; margin-top: 60px;">
    <h1>Assessment Results</h1>
    <div id="score-card" class="score-card">
      <div id="score-percentage" class="score-percentage">0%</div>
      <p id="score-details" class="score-details">You answered 0 out of 0 questions correctly.</p>
    </div>
       <button type="button" id="restartBtn" class="btn-primary" style="margin-top: 25px;">Start New Assessment</button>
  </main>

  <!-- Application Logic Scripts -->
  <script src="questions.js"></script>
  <script src="app.js"></script>

</body>
</html>
